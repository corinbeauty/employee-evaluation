<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不老松足湯 - 店長面試自我評估表</title>
    <style>
        :root {
            --primary: #1e3a2d; /* 極深松綠 */
            --primary-light: #2c5442;
            --accent: #d4af37;  /* 雅緻金 */
            --bg-light: #f7f9f8;
            --text-dark: #222222;
            --text-gray: #666666;
            --border: #e0e0e0;
            --white: #ffffff;
            --success: #2e7d32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 20px 20px 100px 20px;
            position: relative; /* 供右上角按鈕定位 */
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary);
            color: var(--white);
            padding: 40px 30px;
            text-align: center;
            border-bottom: 5px solid var(--accent);
        }
        
        .logo {
            display: block;
            margin: 0 auto 15px auto;
            height: 60px;
            object-fit: contain;
        }

        .header h1 { font-size: 26px; letter-spacing: 2px; margin-bottom: 10px; }
        .header p { color: #d1d9d5; font-size: 14px; max-width: 700px; margin: 0 auto; }

        .content { padding: 40px 30px; }

        .basic-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            background: #fafafa;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        label { font-weight: bold; font-size: 14px; color: var(--primary); }
        
        input[type="text"], input[type="date"], textarea {
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
            width: 100%;
            background: var(--white);
        }

        input[readonly] { background: #f0f0f0; cursor: not-allowed; color: var(--text-gray); }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        textarea.auto-expand {
            min-height: 80px;
            resize: none;
            overflow: hidden;
        }

        .section-title {
            font-size: 20px;
            color: var(--primary);
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
        }

        .question-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: border-color 0.3s;
        }
        
        .question-card:hover { border-color: #cbd5e1; }

        .q-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #111; }

        .score-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .score-label { font-size: 14px; font-weight: bold; color: var(--text-gray); }
        .score-options { display: flex; gap: 8px; }
        .score-radio { display: none; }
        .score-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: #fafafa;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-gray);
            transition: all 0.2s;
        }

        .score-radio:checked + .score-btn {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .answer-boxes { display: flex; flex-direction: column; gap: 12px; }

        .progress-tracker {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 58, 45, 0.95);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            gap: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .submit-btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 16px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .submit-btn:hover { background-color: var(--primary-light); }
        .submit-btn:disabled { background-color: #a0aab2; cursor: not-allowed; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content {
            background: white; padding: 30px; border-radius: 8px;
            text-align: center; max-width: 400px;
            transform: translateY(20px); transition: transform 0.3s;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-content.large { max-width: 900px; width: 95%; text-align: left; background: var(--bg-light); padding: 25px; height: 90vh; }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-content h3 { color: var(--primary); margin-bottom: 15px; }
        .modal-content button {
            margin-top: 20px; padding: 10px 25px;
            background: var(--primary); color: white;
            border: none; border-radius: 4px; cursor: pointer;
        }

        .admin-btn {
            position: absolute; top: 15px; right: 15px; 
            width: 24px; height: 24px; 
            background: #999; border-radius: 50%; 
            opacity: 0.15; cursor: pointer; z-index: 999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.3s;
        }
        .admin-btn:hover { opacity: 0.8; }
        .admin-btn::after { content: '⚙'; color: white; font-size: 14px; }
        
        .admin-panel { display: none; padding: 30px; background: var(--bg-light); min-height: 100vh; }
        .admin-panel.active { display: block; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        .admin-table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; margin-bottom: 30px; }
        .admin-table th, .admin-table td { padding: 12px 15px; border-bottom: 1px solid var(--border); text-align: left; }
        .admin-table th { background: var(--primary); color: white; font-weight: normal; }
        .btn-view { background: var(--primary-light); color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-view:hover { background: var(--primary); }
        
        .score-tags { display: flex; gap: 5px; flex-wrap: wrap; max-width: 300px; }
        .score-tag { background: #f0f0f0; border: 1px solid #ccc; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #555; }
        
        .photo-section { margin-top: 20px; background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        .photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 15px; }
        .photo-gallery img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }

        .missing-fields {
            background: #fff3f3; border: 1px solid #ffcdd2;
            border-radius: 8px; padding: 20px;
            margin-bottom: 20px; display: none;
        }
        .missing-fields h4 { color: #d32f2f; margin-bottom: 12px; font-size: 16px; }
        .missing-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .missing-item {
            background: #ffebee; color: #c62828; padding: 8px 15px;
            border-radius: 20px; font-size: 14px; cursor: pointer;
            transition: all 0.2s; border: 1px solid #ffcdd2; font-weight: bold;
        }
        .missing-item:hover { background: #ffcdd2; transform: translateY(-2px); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        @media (max-width: 600px) {
            .content, .header { padding: 20px; }
            .progress-tracker { width: 90%; justify-content: center; flex-direction: column; gap: 5px; text-align: center; }
            .admin-table { display: block; overflow-x: auto; white-space: nowrap; }
        }
    </style>
</head>
<body>

<div class="admin-btn" onclick="showAdminLogin()" title="管理員登入"></div>

<!-- 管理員密碼 Modal -->
<div class="modal-overlay" id="adminLoginModal">
    <div class="modal-content">
        <h3>🔒 管理員登入</h3>
        <input type="password" id="adminPwd" placeholder="請輸入管理密碼" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px; text-align:center;">
        <div id="pwdErrorMsg" style="color:red; font-size:13px; margin-bottom:15px; height:18px;"></div>
        <div style="display:flex;gap:10px;justify-content:center;">
            <button onclick="closeAdminModal()" style="background:#888; margin-top:0;">取消</button>
            <button onclick="verifyAdmin()" style="margin-top:0;">登入</button>
        </div>
    </div>
</div>

<!-- 人員詳細資料 Modal -->
<div class="modal-overlay" id="applicantDetailsModal">
    <div class="modal-content large" id="applicantDetailsContent">
        <!-- 內容由 JS 動態填入 -->
    </div>
</div>

<!-- 後端管理介面 -->
<div class="admin-panel" id="adminPanel">
    <div class="admin-header">
        <h2 style="color:var(--primary);">不老松 - 後端管理系統</h2>
        <button onclick="exitAdmin()" style="padding:10px 20px;background:#666;color:white;border:none;border-radius:4px;cursor:pointer;">登出返回前台</button>
    </div>

    <h3 style="margin-bottom: 15px; color:#333;">📝 評估表收件列表</h3>
    <div style="overflow-x:auto;">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>面試日期</th>
                    <th>姓名 (含照片)</th>
                    <th>管理經驗</th>
                    <th>總分</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="assessmentList">
                <tr><td colspan="5" style="text-align:center;">載入中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="container" id="mainContainer">
    <div class="header">
        <img src="logo.png" alt="不老松 Logo" class="logo" onerror="this.style.display='none'">
        <h1>不老松店長面試自我評估表</h1>
        <p>我們尋找能扛壓、思緒敏捷、具備強大自我修復力的實戰將才。請詳實填寫以下情境，展現您的管理手腕與決策邏輯。</p>
    </div>

    <div class="content">
        <form id="assessmentForm" novalidate>
            <div class="basic-info">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="applicantName" required placeholder="請輸入姓名">
                </div>
                <div class="form-group">
                    <label>面試日期</label>
                    <input type="date" id="interviewDate" required readonly>
                </div>
                <div class="form-group">
                    <label>管理經驗</label>
                    <input type="text" id="managementExp" required placeholder="例如：5年連鎖餐飲店長">
                </div>
                <div class="form-group">
                    <label>管理規模</label>
                    <input type="text" id="managementScale" required placeholder="例如：管理20人團隊">
                </div>
                <div class="form-group full-width">
                    <label>應徵動機</label>
                    <textarea class="auto-expand" id="motivation" required placeholder="請簡述您的應徵動機..."></textarea>
                </div>
            </div>

            <div id="questionsContainer">
                <!-- Questions will be injected here by JavaScript -->
            </div>

            <div id="missingFieldsContainer" class="missing-fields">
                <h4>⚠️ 還有未完成的項目，請點選下方按鈕自動前往補充：</h4>
                <div class="missing-list" id="missingList"></div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">確認送出評估表</button>
        </form>
    </div>
</div>

<div class="progress-tracker">
    <span id="scoreProgress">評估進度：0/19 題已評分</span>
    <span id="answerProgress">0/19 題已作答</span>
</div>

<!-- Modal for success message -->
<div class="modal-overlay" id="successModal">
    <div class="modal-content">
        <h3>✅ 提交成功</h3>
        <p>已完成請至櫃台通知面試官</p>
        <button onclick="closeModal()">關閉</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyACBeyjI_5qQ_UDygYQVPZ1PhA1Byjs7gw",
        authDomain: "performance-review-3fb28.firebaseapp.com",
        projectId: "performance-review-3fb28",
        storageBucket: "performance-review-3fb28.firebasestorage.app",
        messagingSenderId: "353081675040",
        appId: "1:353081675040:web:0451e1455e48c4bd42db45",
        measurementId: "G-M7XNX00SK3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const appIdStr = typeof __app_id !== 'undefined' ? __app_id : 'bulaosong-manager-assessment';
    let currentUser = null;
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    async function initAuth() {
        try {
            if (initialAuthToken) {
                const userCredential = await signInWithCustomToken(auth, initialAuthToken);
                currentUser = userCredential.user;
            } else {
                const userCredential = await signInAnonymously(auth);
                currentUser = userCredential.user;
            }
            console.log("Authenticated as:", currentUser.uid);
        } catch (error) {
            console.error("Auth error:", error);
        }
    }

    const questionData = [
        {
            section: "一、人員管理與團隊領導",
            questions: [
                "1.1 一位資深師傅技術很好、業績也高，但經常不配合公司規定，你會如何處理？",
                "1.2 如果員工之間發生衝突，甚至分成不同派系，你會如何處理？",
                "1.3 你如何讓員工願意主動工作，而不是每件事都要店長提醒？"
            ]
        },
        {
            section: "二、業績管理與數據分析",
            questions: [
                "2.1 如果門店連續兩個月業績下滑，你會如何找出原因？",
                "2.2 公司設定的業績目標很高，但目前進度落後，你會如何帶領團隊追上？",
                "2.3 如果業績達標，但顧客回流率、評論或服務品質持續下降，你會怎麼做？"
            ]
        },
        {
            section: "三、顧客服務與客訴處理",
            questions: [
                "3.1 顧客抱怨師傅服務品質不佳，要求退費或補償，你會如何處理？",
                "3.2 如果顧客提出不合理要求，甚至在現場大聲責罵員工，你會如何處理？"
            ]
        },
        {
            section: "四、現場營運與突發應變",
            questions: [
                "4.1 假日尖峰時段突然有多位師傅請假，現場客人很多，你會如何調度？",
                "4.2 如果門店環境、休息室、櫃台及服務流程經常出現疏漏，你會如何改善？",
                "4.3 如果發生重大客訴、設備故障或其他影響營運的事件，你如何判斷哪些事情要立即處理、哪些事情要回報主管？"
            ]
        },
        {
            section: "五、排班、人力配置與公平性",
            questions: [
                "5.1 如何在滿足員工休假需求的同時，確保門店各時段人力充足？",
                "5.2 如果員工認為排班不公平，甚至因此拒絕配合，你會如何處理？"
            ]
        },
        {
            section: "六、成本、資源與獲利管理",
            questions: [
                "6.1 門店營收不錯，但獲利不理想，你會優先檢查哪些項目？",
                "6.2 如果公司要求提高營收，但不能無限制增加人力與行銷費用，你會怎麼做？"
            ]
        },
        {
            section: "七、制度執行與問題改善",
            questions: [
                "7.1 公司推出新制度，但員工普遍不願意配合，你會如何推動？",
                "7.2 請舉出一個你曾經解決的工作問題，說明原本的問題、採取的行動及最後的結果。"
            ]
        },
        {
            section: "八、責任感、抗壓與自我成長",
            questions: [
                "8.1 如果門店業績不佳，而你認為問題主要出在員工或公司制度，你會怎麼做？",
                "8.2 你認為自己目前最不足的三項店長能力是什麼？你打算如何改善？"
            ]
        }
    ];

    const totalQuestions = 19;
    
    function setTodayDate() {
        const today = new Date();
        const dateString = today.toISOString().split('T')[0];
        document.getElementById('interviewDate').value = dateString;
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        let globalQIndex = 1;

        questionData.forEach((sec) => {
            const secTitle = document.createElement('h2');
            secTitle.className = 'section-title';
            secTitle.textContent = sec.section;
            container.appendChild(secTitle);

            sec.questions.forEach((qText) => {
                const qCard = document.createElement('div');
                qCard.className = 'question-card';
                qCard.dataset.qid = globalQIndex;
                
                let scoreHTML = '';
                for(let i=1; i<=5; i++) {
                    scoreHTML += `
                        <label>
                            <input type="radio" name="q${globalQIndex}_score" value="${i}" class="score-radio track-score">
                            <span class="score-btn">${i}</span>
                        </label>
                    `;
                }

                qCard.innerHTML = `
                    <div class="q-title">${qText}</div>
                    <div class="score-group">
                        <span class="score-label">自評分數 (1-5)：</span>
                        <div class="score-options">${scoreHTML}</div>
                    </div>
                    <div class="answer-boxes">
                        <textarea class="auto-expand track-answer main-answer" name="q${globalQIndex}_answer" placeholder="【回答】請描述您的處理邏輯與具體做法..." required></textarea>
                        <textarea class="auto-expand track-answer case-answer" name="q${globalQIndex}_case" placeholder="【案例】請舉出過往相關的實戰經驗（選填）..."></textarea>
                    </div>
                `;
                container.appendChild(qCard);
                globalQIndex++;
            });
        });
    }

    function setupEventListeners() {
        const textareas = document.querySelectorAll('.auto-expand');
        const adjustHeight = (el) => {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight + 2) + 'px';
        };

        textareas.forEach(ta => {
            ta.addEventListener('input', function() { adjustHeight(this); });
            adjustHeight(ta); // Init
        });

        const scoreTracker = document.getElementById('scoreProgress');
        const answerTracker = document.getElementById('answerProgress');

        const updateProgress = () => {
            const scoredCards = new Set();
            document.querySelectorAll('.track-score:checked').forEach(radio => {
                scoredCards.add(radio.name);
            });

            let answeredCount = 0;
            document.querySelectorAll('.main-answer').forEach(ta => {
                if (ta.value.trim().length > 0) answeredCount++;
            });

            scoreTracker.textContent = `評估進度：${scoredCards.size}/${totalQuestions} 題已評分`;
            answerTracker.textContent = `${answeredCount}/${totalQuestions} 題已作答`;
        };

        document.getElementById('assessmentForm').addEventListener('input', updateProgress);
        document.getElementById('assessmentForm').addEventListener('change', updateProgress);
    }

    document.getElementById('assessmentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) {
            console.error("尚未驗證身份，無法儲存");
            return;
        }

        let hasError = false;
        const missingList = document.getElementById('missingList');
        const missingContainer = document.getElementById('missingFieldsContainer');
        missingList.innerHTML = '';
        
        const addMissingItem = (text, targetElement) => {
            const btn = document.createElement('div');
            btn.className = 'missing-item';
            btn.textContent = text;
            btn.onclick = () => {
                targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetElement.style.transition = 'box-shadow 0.3s, border-color 0.3s';
                targetElement.style.borderColor = '#d32f2f';
                targetElement.style.boxShadow = '0 0 15px rgba(211, 47, 47, 0.4)';
                setTimeout(() => { 
                    targetElement.style.borderColor = 'var(--border)';
                    targetElement.style.boxShadow = '0 2px 8px rgba(0,0,0,0.02)'; 
                }, 2000);
            };
            missingList.appendChild(btn);
        };

        const basicFields = [
            { id: 'applicantName', name: '姓名' },
            { id: 'managementExp', name: '管理經驗' },
            { id: 'managementScale', name: '管理規模' },
            { id: 'motivation', name: '應徵動機' }
        ];
        
        basicFields.forEach(field => {
            const el = document.getElementById(field.id);
            if (!el.value.trim()) {
                hasError = true;
                addMissingItem(`基本資料：${field.name}`, el.parentElement);
            }
        });

        for(let i=1; i<=totalQuestions; i++) {
            const scoreEle = document.querySelector(`input[name="q${i}_score"]:checked`);
            const ansEle = document.querySelector(`textarea[name="q${i}_answer"]`);
            const qCard = document.querySelector(`.question-card[data-qid="${i}"]`);
            
            let missingParts = [];
            if (!scoreEle) missingParts.push('自評分數');
            if (!ansEle || !ansEle.value.trim()) missingParts.push('回答');
            
            if (missingParts.length > 0) {
                hasError = true;
                addMissingItem(`第 ${i} 題 (${missingParts.join('、')})`, qCard);
            }
        }

        if (hasError) {
            missingContainer.style.display = 'block';
            missingContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }
        
        missingContainer.style.display = 'none';
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '資料儲存中...';

        try {
            const formData = {
                basicInfo: {
                    name: document.getElementById('applicantName').value,
                    date: document.getElementById('interviewDate').value,
                    experience: document.getElementById('managementExp').value,
                    scale: document.getElementById('managementScale').value,
                    motivation: document.getElementById('motivation').value
                },
                responses: [],
                submittedAt: new Date().toISOString()
            };

            for(let i=1; i<=totalQuestions; i++) {
                const scoreEle = document.querySelector(`input[name="q${i}_score"]:checked`);
                const ansEle = document.querySelector(`textarea[name="q${i}_answer"]`);
                const caseEle = document.querySelector(`textarea[name="q${i}_case"]`);
                
                formData.responses.push({
                    questionId: i,
                    score: scoreEle ? parseInt(scoreEle.value) : null,
                    answer: ansEle ? ansEle.value : "",
                    caseStudy: caseEle ? caseEle.value : ""
                });
            }

            const colRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'assessments');
            await addDoc(colRef, formData);

            document.getElementById('successModal').classList.add('show');
            
        } catch (error) {
            console.error("Error writing document: ", error);
            alert("儲存失敗，請稍後再試或檢查網路連線。");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '確認送出評估表';
        }
    });

    window.closeModal = function() {
        document.getElementById('successModal').classList.remove('show');
    };

    window.showAdminLogin = function() { document.getElementById('adminLoginModal').classList.add('show'); };
    window.closeAdminModal = function() { 
        document.getElementById('adminLoginModal').classList.remove('show'); 
        document.getElementById('adminPwd').value = '';
        document.getElementById('pwdErrorMsg').textContent = '';
    };

    let cachedAssessments = [];

    window.verifyAdmin = function() {
        const pwd = document.getElementById('adminPwd').value;
        if(pwd === '7310168888') {
            document.getElementById('adminLoginModal').classList.remove('show');
            document.getElementById('mainContainer').style.display = 'none';
            document.querySelector('.progress-tracker').style.display = 'none';
            document.getElementById('adminPanel').classList.add('active');
            loadAdminData();
        } else {
            document.getElementById('pwdErrorMsg').textContent = '密碼錯誤，請重新輸入';
        }
    };

    window.exitAdmin = function() {
        document.getElementById('adminPanel').classList.remove('active');
        document.getElementById('mainContainer').style.display = 'block';
        document.querySelector('.progress-tracker').style.display = 'flex';
        document.getElementById('adminPwd').value = '';
    };

    async function loadAdminData() {
        if (!currentUser) return;
        const listEl = document.getElementById('assessmentList');
        try {
            // 先取得所有照片資料
            const photoColRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'photos');
            const photoSnap = await getDocs(photoColRef);
            let photosMap = {};
            photoSnap.forEach(d => {
                let data = d.data();
                if (!photosMap[data.assessmentId]) photosMap[data.assessmentId] = [];
                photosMap[data.assessmentId].push({ id: d.id, ...data });
            });

            // 取得評估表資料
            const colRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'assessments');
            const snapshot = await getDocs(colRef);
            cachedAssessments = [];
            
            snapshot.forEach(doc => {
                cachedAssessments.push({ id: doc.id, ...doc.data() });
            });

            cachedAssessments.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
            
            listEl.innerHTML = '';
            if(cachedAssessments.length === 0) {
                listEl.innerHTML = '<tr><td colspan="5" style="text-align:center;">尚無資料</td></tr>';
                return;
            }

            cachedAssessments.forEach(item => {
                let totalScore = 0;
                item.responses.forEach(r => { totalScore += (r.score || 0); });
                const maxScore = item.responses.length * 5;

                // 取出該人員最新照片
                const userPhotos = photosMap[item.id] || [];
                userPhotos.sort((a,b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));
                const mainPhoto = userPhotos.length > 0 ? userPhotos[0] : null;

                let nameDisplay = item.basicInfo.name || '未填';
                if(mainPhoto) {
                    const offsetY = mainPhoto.offsetY !== undefined ? mainPhoto.offsetY : 50;
                    nameDisplay = `<div style="display:flex; align-items:center; gap:12px;">
                        <img src="${mainPhoto.url}" style="width:45px;height:45px;border-radius:50%;object-fit:cover;object-position:center ${offsetY}%;box-shadow:0 2px 5px rgba(0,0,0,0.15); border: 2px solid white;">
                        <strong style="font-size:16px;">${item.basicInfo.name || '未填'}</strong>
                    </div>`;
                } else {
                    nameDisplay = `<strong>${nameDisplay}</strong>`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.basicInfo.date || '未知'}</td>
                    <td>${nameDisplay}</td>
                    <td>${item.basicInfo.experience || '未填'}</td>
                    <td><strong style="color:var(--primary);">${totalScore}</strong> / ${maxScore}</td>
                    <td><button class="btn-view" onclick="showApplicantDetails('${item.id}')">進入面試 / 詳情</button></td>
                `;
                listEl.appendChild(tr);
            });
        } catch(error) {
            console.error("載入資料失敗:", error);
            listEl.innerHTML = '<tr><td colspan="5" style="text-align:center;color:red;">載入失敗，請檢查網路及權限</td></tr>';
        }
    }

    window.showApplicantDetails = function(docId) {
        const item = cachedAssessments.find(a => a.id === docId);
        if(!item) return;

        let detailsHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; border-bottom: 3px solid var(--accent); padding-bottom: 15px;">
                <h2 style="margin:0; color: var(--primary);">📝 面試者資料與答題列表</h2>
                <button onclick="closeDetailsModal()" style="margin:0; padding:8px 25px; background:#555; color:white; border:none; border-radius:4px; font-size:15px; cursor:pointer;">返回列表</button>
            </div>
            
            <div class="photo-section" style="margin-bottom: 25px; border-left: 4px solid var(--primary);">
                <h4 style="margin-bottom: 10px; color: var(--text-dark);">📸 證件或照片上傳區</h4>
                <div style="display:flex; gap:10px; align-items:center; margin-bottom: 15px;">
                    <input type="file" id="photoInput_${docId}" accept="image/*" style="border:1px solid #ccc; background: white; padding:8px; border-radius:6px; flex-grow:1;">
                    <button onclick="uploadApplicantPhoto('${docId}')" style="margin:0; padding:10px 20px; background:var(--primary-light); color:white; border:none; border-radius:6px; cursor:pointer;">確認上傳</button>
                </div>
                <div id="uploadStatus_${docId}" style="font-size:14px; margin-bottom:15px; font-weight:bold;"></div>
                <div class="photo-gallery" id="photoGallery_${docId}" style="display:flex; flex-wrap:wrap; gap:15px;">載入照片中...</div>
            </div>

            <div class="basic-info" style="margin-bottom: 30px; grid-template-columns: repeat(2, 1fr);">
                <div class="form-group"><label>面試日期</label><div style="padding:12px 15px; background:#fff; border:1px solid var(--border); border-radius:6px;">${item.basicInfo.date}</div></div>
                <div class="form-group"><label>姓名</label><div style="padding:12px 15px; background:#fff; border:1px solid var(--border); border-radius:6px;">${item.basicInfo.name}</div></div>
                <div class="form-group"><label>管理經驗</label><div style="padding:12px 15px; background:#fff; border:1px solid var(--border); border-radius:6px;">${item.basicInfo.experience}</div></div>
                <div class="form-group"><label>管理規模</label><div style="padding:12px 15px; background:#fff; border:1px solid var(--border); border-radius:6px;">${item.basicInfo.scale}</div></div>
                <div class="form-group full-width"><label>應徵動機</label><div style="padding:15px; background:#fff; border:1px solid var(--border); border-radius:6px; line-height:1.6;">${item.basicInfo.motivation.replace(/\n/g, '<br>')}</div></div>
            </div>
            
            <h3 style="margin: 30px 0 20px 0; color: var(--primary); font-size:22px; text-align:center;">--- 實戰情境考題 ---</h3>
        `;

        // 將考題採用前端的卡片風格印出
        let qIndex = 1;
        questionData.forEach(sec => {
            detailsHTML += `<div class="section-title">${sec.section}</div>`;
            sec.questions.forEach(qText => {
                const response = item.responses.find(r => r.questionId === qIndex) || { score: '未評', answer: '', caseStudy: '' };
                detailsHTML += `
                    <div class="question-card" style="background:white;">
                        <div class="q-title" style="font-size:17px;">${qText}</div>
                        <div class="score-group" style="margin-bottom:20px;">
                            <span class="score-label">應徵者自評分數：</span>
                            <span style="font-size:20px; font-weight:bold; color:var(--primary); background:rgba(212, 175, 55, 0.2); padding:2px 12px; border-radius:20px;">${response.score} / 5</span>
                        </div>
                        <div class="answer-boxes">
                            <div style="background:#f9fbfb; padding:15px; border-radius:8px; border:1px solid #e2e8e5;">
                                <strong style="color:var(--primary); font-size:14px; display:block; margin-bottom:8px;">【回答邏輯與做法】</strong>
                                <div style="color:#222; line-height:1.6;">${response.answer.replace(/\n/g, '<br>') || '<span style="color:#999;">(未填寫)</span>'}</div>
                            </div>
                            ${response.caseStudy ? `
                            <div style="background:#fffcf5; padding:15px; border-radius:8px; border:1px solid #f6e5b5; margin-top:12px;">
                                <strong style="color:#b38f29; font-size:14px; display:block; margin-bottom:8px;">【過往實戰案例】</strong>
                                <div style="color:#333; line-height:1.6;">${response.caseStudy.replace(/\n/g, '<br>')}</div>
                            </div>` : ''}
                        </div>
                    </div>
                `;
                qIndex++;
            });
        });

        const notesValue = item.interviewerNotes || '';
        detailsHTML += `
            <div style="margin-top: 40px; border: 2px solid #d32f2f; border-radius: 8px; padding: 25px; background: #fffaf9; box-shadow: 0 4px 15px rgba(211,47,47,0.1);">
                <h3 style="color: #d32f2f; margin-bottom: 15px; display:flex; align-items:center; gap:10px;">🔴 面試官專用評語 / 備註區</h3>
                <textarea id="interviewerNotes_${docId}" style="width:100%; min-height:150px; padding:15px; border:1px solid #ffcdd2; border-radius:6px; font-size:16px; font-family:inherit; resize:vertical; line-height:1.6;" placeholder="請在此輸入面試觀察、結論或後續錄取評定...">${notesValue}</textarea>
                <button onclick="saveInterviewerNotes('${docId}', event)" style="margin-top:20px; background:#d32f2f; color:white; border:none; border-radius:6px; padding:15px; width:100%; font-size:18px; cursor:pointer; font-weight:bold; letter-spacing:2px; transition:0.3s;">💾 儲存面試官備註</button>
            </div>
        `;

        document.getElementById('applicantDetailsContent').innerHTML = detailsHTML;
        document.getElementById('applicantDetailsModal').classList.add('show');
        
        loadApplicantPhotos(docId);
    };

    window.closeDetailsModal = function() {
        document.getElementById('applicantDetailsModal').classList.remove('show');
    };

    window.uploadApplicantPhoto = async function(assessmentId) {
        if (!currentUser) return;
        const fileInput = document.getElementById(`photoInput_${assessmentId}`);
        const file = fileInput.files[0];
        const statusDiv = document.getElementById(`uploadStatus_${assessmentId}`);
        
        if(!file) { 
            statusDiv.textContent = "❌ 請先選擇檔案"; 
            statusDiv.style.color = "red";
            return; 
        }
        
        statusDiv.textContent = '⏳ 上傳中，請稍候...';
        statusDiv.style.color = '#3b82f6';
        
        try {
            const fileName = `${Date.now()}_${file.name}`;
            const storageRef = ref(storage, `artifacts/${appIdStr}/photos/${assessmentId}/${fileName}`);
            
            // 使用簡化的上傳方式避免卡住
            await uploadBytes(storageRef, file);
            const downloadURL = await getDownloadURL(storageRef);
            
            const photoColRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'photos');
            await addDoc(photoColRef, { 
                assessmentId: assessmentId,
                url: downloadURL, 
                fileName: file.name,
                offsetY: 50, // 預設圖片垂直居中
                uploadedAt: new Date().toISOString() 
            });
            
            statusDiv.textContent = '✅ 上傳成功！';
            statusDiv.style.color = 'var(--success)';
            fileInput.value = '';
            
            loadApplicantPhotos(assessmentId);
            loadAdminData(); // 重新整理列表，更新大頭貼
        } catch(error) {
            console.error("上傳失敗:", error);
            statusDiv.textContent = `❌ 上傳失敗: ${error.message}`;
            statusDiv.style.color = 'red';
        }
    };

    window.loadApplicantPhotos = async function(assessmentId) {
        const gallery = document.getElementById(`photoGallery_${assessmentId}`);
        if (!gallery) return;
        
        try {
            const colRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'photos');
            const snapshot = await getDocs(colRef);
            
            let photos = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                if(data.assessmentId === assessmentId) {
                    photos.push({ id: doc.id, ...data });
                }
            });
            
            photos.sort((a,b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));
            
            gallery.innerHTML = '';
            if(photos.length === 0) {
                gallery.innerHTML = '<span style="color:#999; font-size:14px; padding:10px;">該人員尚未上傳任何照片。</span>';
                return;
            }
            
            photos.forEach(p => {
                const offsetY = p.offsetY !== undefined ? p.offsetY : 50;
                const photoCard = document.createElement('div');
                photoCard.style.cssText = "width: 160px; background: white; border: 1px solid #ddd; border-radius: 8px; padding: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);";
                
                photoCard.innerHTML = `
                    <img id="img_${p.id}" src="${p.url}" title="${p.fileName}" style="width:100%; height:180px; object-fit:cover; object-position:center ${offsetY}%; border-radius:6px; margin-bottom:8px;">
                    <div style="font-size:12px; color:#555; text-align:center; margin-bottom:5px;">↕️ 調整上下顯示位置</div>
                    <input type="range" min="0" max="100" value="${offsetY}" style="width: 100%; cursor: pointer;"
                           oninput="document.getElementById('img_${p.id}').style.objectPosition = 'center ' + this.value + '%'"
                           onchange="savePhotoOffset('${p.id}', this.value)">
                `;
                gallery.appendChild(photoCard);
            });
        } catch(error) {
            console.error("載入照片失敗:", error);
            gallery.innerHTML = '<span style="color:red; font-size:14px;">照片載入失敗</span>';
        }
    };

    window.savePhotoOffset = async function(photoId, offsetValue) {
        try {
            const docRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'photos', photoId);
            await updateDoc(docRef, { offsetY: parseInt(offsetValue) });
            loadAdminData(); // 儲存後一併刷新列表頭像
        } catch(e) {
            console.error("儲存圖片位置失敗:", e);
        }
    };

    window.saveInterviewerNotes = async function(docId, event) {
        try {
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '⏳ 儲存中...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            const notes = document.getElementById(`interviewerNotes_${docId}`).value;
            const docRef = doc(db, 'artifacts', appIdStr, 'public', 'data', 'assessments', docId);
            await updateDoc(docRef, { interviewerNotes: notes });

            // 同步更新本地端快取資料
            const item = cachedAssessments.find(a => a.id === docId);
            if(item) item.interviewerNotes = notes;

            btn.textContent = '✅ 已成功儲存！';
            btn.style.background = '#2e7d32'; // 轉為綠色
            btn.style.opacity = '1';
            
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
                btn.style.background = '#d32f2f'; // 恢復紅色
            }, 2500);
        } catch(e) {
            console.error("儲存備註失敗:", e);
            alert("儲存失敗，請檢查網路連線。");
            event.target.disabled = false;
            event.target.textContent = '💾 儲存面試官備註';
            event.target.style.opacity = '1';
        }
    };

    window.addEventListener('DOMContentLoaded', async () => {
        setTodayDate();
        renderQuestions();
        setupEventListeners();
        await initAuth();
    });

</script>
