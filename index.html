<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不老松足湯 - 店長面試自我評估表</title>
    <style>
        :root {
            --primary: #1e3a2d; /* 極深松綠 */
            --primary-light: #2c5442;
            --accent: #d4af37;  /* 雅緻金 */
            --bg-light: #f7f9f8;
            --text-dark: #222222;
            --text-gray: #666666;
            --border: #e0e0e0;
            --white: #ffffff;
            --success: #2e7d32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 20px 20px 100px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary);
            color: var(--white);
            padding: 40px 30px;
            text-align: center;
            border-bottom: 5px solid var(--accent);
        }

        .header h1 { font-size: 26px; letter-spacing: 2px; margin-bottom: 10px; }
        .header p { color: #d1d9d5; font-size: 14px; max-width: 700px; margin: 0 auto; }

        .content { padding: 40px 30px; }

        .basic-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            background: #fafafa;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        label { font-weight: bold; font-size: 14px; color: var(--primary); }
        
        input[type="text"], input[type="date"], textarea {
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
            width: 100%;
            background: var(--white);
        }

        input[readonly] { background: #f0f0f0; cursor: not-allowed; color: var(--text-gray); }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        textarea.auto-expand {
            min-height: 80px;
            resize: none;
            overflow: hidden;
        }

        .section-title {
            font-size: 20px;
            color: var(--primary);
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
        }

        .question-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: border-color 0.3s;
        }
        
        .question-card:hover { border-color: #cbd5e1; }

        .q-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #111; }

        .score-group {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .score-label { font-size: 14px; font-weight: bold; color: var(--text-gray); }

        .score-options { display: flex; gap: 8px; }

        .score-radio {
            display: none;
        }

        .score-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: #fafafa;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-gray);
            transition: all 0.2s;
        }

        .score-radio:checked + .score-btn {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .answer-boxes { display: flex; flex-direction: column; gap: 12px; }

        .progress-tracker {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 58, 45, 0.95);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            gap: 20px;
            font-size: 14px;
            font-weight: bold;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .submit-btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 16px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .submit-btn:hover { background-color: var(--primary-light); }
        .submit-btn:disabled { background-color: #a0aab2; cursor: not-allowed; }

        /* Modal styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content {
            background: white; padding: 30px; border-radius: 8px;
            text-align: center; max-width: 400px;
            transform: translateY(20px); transition: transform 0.3s;
        }
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-content h3 { color: var(--primary); margin-bottom: 15px; }
        .modal-content button {
            margin-top: 20px; padding: 10px 25px;
            background: var(--primary); color: white;
            border: none; border-radius: 4px; cursor: pointer;
        }

        /* 標誌與管理員專用樣式 */
        .logo {
            position: absolute; 
            top: 20px; 
            left: 20px; 
            height: 60px;
            z-index: 100;
        }
        .admin-btn {
            position: absolute; top: 15px; right: 15px; 
            width: 24px; height: 24px; 
            background: #999; border-radius: 50%; 
            opacity: 0.15; cursor: pointer; z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.3s;
        }
        .admin-btn:hover { opacity: 0.8; }
        .admin-btn::after { content: '⚙'; color: white; font-size: 14px; }
        
        .admin-panel { display: none; padding: 30px; background: var(--bg-light); min-height: 100vh; }
        .admin-panel.active { display: block; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        .admin-table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; margin-bottom: 30px; }
        .admin-table th, .admin-table td { padding: 12px 15px; border-bottom: 1px solid var(--border); text-align: left; }
        .admin-table th { background: var(--primary); color: white; font-weight: normal; }
        .btn-view { background: var(--primary-light); color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-view:hover { background: var(--primary); }
        .photo-section { margin-top: 20px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .photo-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .photo-gallery img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }

        @media (max-width: 600px) {
            .content, .header { padding: 20px; }
            .progress-tracker { width: 90%; justify-content: center; flex-direction: column; gap: 5px; text-align: center; }
        }
    </style>
</head>
<body>

<!-- 左上角 Logo -->
<img src="logo.png" alt="不老松 Logo" class="logo" onerror="this.style.display='none'">

<!-- 管理員入口按鈕 -->
<div class="admin-btn" onclick="showAdminLogin()" title="管理員登入"></div>

<!-- 管理員密碼 Modal -->
<div class="modal-overlay" id="adminLoginModal">
    <div class="modal-content">
        <h3>🔒 管理員登入</h3>
        <input type="password" id="adminPwd" placeholder="請輸入管理密碼" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:4px; text-align:center;">
        <div id="pwdErrorMsg" style="color:red; font-size:13px; margin-bottom:15px; height:18px;"></div>
        <div style="display:flex;gap:10px;justify-content:center;">
            <button onclick="closeAdminModal()" style="background:#888; margin-top:0;">取消</button>
            <button onclick="verifyAdmin()" style="margin-top:0;">登入</button>
        </div>
    </div>
</div>

<!-- 後端管理介面 -->
<div class="admin-panel" id="adminPanel">
    <div class="admin-header">
        <h2 style="color:var(--primary);">不老松 - 後端管理系統</h2>
        <button onclick="exitAdmin()" style="padding:10px 20px;background:#666;color:white;border:none;border-radius:4px;cursor:pointer;">登出返回前台</button>
    </div>

    <h3 style="margin-bottom: 15px; color:#333;">📝 評估表收件列表</h3>
    <div style="overflow-x:auto;">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>面試日期</th>
                    <th>姓名</th>
                    <th>管理經驗</th>
                    <th>管理規模</th>
                    <th style="min-width: 100px;">分數/總分</th>
                    <th>各題自評清單</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="assessmentList">
                <tr><td colspan="7" style="text-align:center;">載入中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="container" id="mainContainer">
    <div class="header">
        <h1>不老松店長面試自我評估表</h1>
        <p>我們尋找能扛壓、思緒敏捷、具備強大自我修復力的實戰將才。請詳實填寫以下情境，展現您的管理手腕與決策邏輯。</p>
    </div>

    <div class="content">
        <form id="assessmentForm">
            <div class="basic-info">
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="applicantName" required placeholder="請輸入姓名">
                </div>
                <div class="form-group">
                    <label>面試日期</label>
                    <input type="date" id="interviewDate" required readonly>
                </div>
                <div class="form-group">
                    <label>管理經驗</label>
                    <input type="text" id="managementExp" required placeholder="例如：5年連鎖餐飲店長">
                </div>
                <div class="form-group">
                    <label>管理規模</label>
                    <input type="text" id="managementScale" required placeholder="例如：管理20人團隊">
                </div>
                <div class="form-group full-width">
                    <label>應徵動機</label>
                    <textarea class="auto-expand" id="motivation" required placeholder="請簡述您的應徵動機..."></textarea>
                </div>
            </div>

            <div id="questionsContainer">
                <!-- Questions will be injected here by JavaScript -->
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">確認送出評估表</button>
        </form>
    </div>
</div>

<div class="progress-tracker">
    <span id="scoreProgress">評估進度：0/19 題已評分</span>
    <span id="answerProgress">0/19 題已作答</span>
</div>

<!-- Modal for success message -->
<div class="modal-overlay" id="successModal">
    <div class="modal-content">
        <h3>✅ 提交成功</h3>
        <p>您的評估表已成功記錄至系統，感謝您的填寫。</p>
        <button onclick="closeModal()">關閉</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

    // Initialize Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyACBeyjI_5qQ_UDygYQVPZ1PhA1Byjs7gw",
        authDomain: "performance-review-3fb28.firebaseapp.com",
        projectId: "performance-review-3fb28",
        storageBucket: "performance-review-3fb28.firebasestorage.app",
        messagingSenderId: "353081675040",
        appId: "1:353081675040:web:0451e1455e48c4bd42db45",
        measurementId: "G-M7XNX00SK3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Context Variables
    const appIdStr = typeof __app_id !== 'undefined' ? __app_id : 'bulaosong-manager-assessment';
    
    // Auth Flow
    let currentUser = null;
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    async function initAuth() {
        try {
            if (initialAuthToken) {
                const userCredential = await signInWithCustomToken(auth, initialAuthToken);
                currentUser = userCredential.user;
            } else {
                const userCredential = await signInAnonymously(auth);
                currentUser = userCredential.user;
            }
            console.log("Authenticated as:", currentUser.uid);
        } catch (error) {
            console.error("Auth error:", error);
        }
    }

    const questionData = [
        {
            section: "一、人員管理與團隊領導",
            questions: [
                "1.1 一位資深師傅技術很好、業績也高，但經常不配合公司規定，你會如何處理？",
                "1.2 如果員工之間發生衝突，甚至分成不同派系，你會如何處理？",
                "1.3 你如何讓員工願意主動工作，而不是每件事都要店長提醒？"
            ]
        },
        {
            section: "二、業績管理與數據分析",
            questions: [
                "2.1 如果門店連續兩個月業績下滑，你會如何找出原因？",
                "2.2 公司設定的業績目標很高，但目前進度落後，你會如何帶領團隊追上？",
                "2.3 如果業績達標，但顧客回流率、評論或服務品質持續下降，你會怎麼做？"
            ]
        },
        {
            section: "三、顧客服務與客訴處理",
            questions: [
                "3.1 顧客抱怨師傅服務品質不佳，要求退費或補償，你會如何處理？",
                "3.2 如果顧客提出不合理要求，甚至在現場大聲責罵員工，你會如何處理？"
            ]
        },
        {
            section: "四、現場營運與突發應變",
            questions: [
                "4.1 假日尖峰時段突然有多位師傅請假，現場客人很多，你會如何調度？",
                "4.2 如果門店環境、休息室、櫃台及服務流程經常出現疏漏，你會如何改善？",
                "4.3 如果發生重大客訴、設備故障或其他影響營運的事件，你如何判斷哪些事情要立即處理、哪些事情要回報主管？"
            ]
        },
        {
            section: "五、排班、人力配置與公平性",
            questions: [
                "5.1 如何在滿足員工休假需求的同時，確保門店各時段人力充足？",
                "5.2 如果員工認為排班不公平，甚至因此拒絕配合，你會如何處理？"
            ]
        },
        {
            section: "六、成本、資源與獲利管理",
            questions: [
                "6.1 門店營收不錯，但獲利不理想，你會優先檢查哪些項目？",
                "6.2 如果公司要求提高營收，但不能無限制增加人力與行銷費用，你會怎麼做？"
            ]
        },
        {
            section: "七、制度執行與問題改善",
            questions: [
                "7.1 公司推出新制度，但員工普遍不願意配合，你會如何推動？",
                "7.2 請舉出一個你曾經解決的工作問題，說明原本的問題、採取的行動及最後的結果。"
            ]
        },
        {
            section: "八、責任感、抗壓與自我成長",
            questions: [
                "8.1 如果門店業績不佳，而你認為問題主要出在員工或公司制度，你會怎麼做？",
                "8.2 你認為自己目前最不足的三項店長能力是什麼？你打算如何改善？"
            ]
        }
    ];

    const totalQuestions = 19;
    
    function setTodayDate() {
        const today = new Date();
        const dateString = today.toISOString().split('T')[0];
        document.getElementById('interviewDate').value = dateString;
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        let globalQIndex = 1;

        questionData.forEach((sec) => {
            // Add Section Title
            const secTitle = document.createElement('h2');
            secTitle.className = 'section-title';
            secTitle.textContent = sec.section;
            container.appendChild(secTitle);

            // Add Questions
            sec.questions.forEach((qText) => {
                const qCard = document.createElement('div');
                qCard.className = 'question-card';
                qCard.dataset.qid = globalQIndex;
                
                let scoreHTML = '';
                for(let i=1; i<=5; i++) {
                    scoreHTML += `
                        <label>
                            <input type="radio" name="q${globalQIndex}_score" value="${i}" class="score-radio track-score">
                            <span class="score-btn">${i}</span>
                        </label>
                    `;
                }

                qCard.innerHTML = `
                    <div class="q-title">${qText}</div>
                    <div class="score-group">
                        <span class="score-label">自評分數 (1-5)：</span>
                        <div class="score-options">${scoreHTML}</div>
                    </div>
                    <div class="answer-boxes">
                        <textarea class="auto-expand track-answer main-answer" name="q${globalQIndex}_answer" placeholder="【回答】請描述您的處理邏輯與具體做法..." required></textarea>
                        <textarea class="auto-expand track-answer case-answer" name="q${globalQIndex}_case" placeholder="【案例】請舉出過往相關的實戰經驗（選填）..."></textarea>
                    </div>
                `;
                container.appendChild(qCard);
                globalQIndex++;
            });
        });
    }

    function setupEventListeners() {
        // Auto-expand textareas
        const textareas = document.querySelectorAll('.auto-expand');
        const adjustHeight = (el) => {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight + 2) + 'px';
        };

        textareas.forEach(ta => {
            ta.addEventListener('input', function() { adjustHeight(this); });
            adjustHeight(ta); // Init
        });

        // Track Progress
        const scoreTracker = document.getElementById('scoreProgress');
        const answerTracker = document.getElementById('answerProgress');

        const updateProgress = () => {
            // Count scored
            const scoredCards = new Set();
            document.querySelectorAll('.track-score:checked').forEach(radio => {
                scoredCards.add(radio.name);
            });

            // Count answered (only requiring main answer to be considered 'answered')
            let answeredCount = 0;
            document.querySelectorAll('.main-answer').forEach(ta => {
                if (ta.value.trim().length > 0) answeredCount++;
            });

            scoreTracker.textContent = `評估進度：${scoredCards.size}/${totalQuestions} 題已評分`;
            answerTracker.textContent = `${answeredCount}/${totalQuestions} 題已作答`;
        };

        document.getElementById('assessmentForm').addEventListener('input', updateProgress);
        document.getElementById('assessmentForm').addEventListener('change', updateProgress);
    }

    document.getElementById('assessmentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!currentUser) {
            console.error("尚未驗證身份，無法儲存");
            return;
        }

        // Check if all scores are filled
        const scoredCount = document.querySelectorAll('.track-score:checked').length;
        if(scoredCount < totalQuestions) {
            alert("請確保每一題都已選擇「自評分數」");
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '資料儲存中...';

        try {
            // Collect Data
            const formData = {
                basicInfo: {
                    name: document.getElementById('applicantName').value,
                    date: document.getElementById('interviewDate').value,
                    experience: document.getElementById('managementExp').value,
                    scale: document.getElementById('managementScale').value,
                    motivation: document.getElementById('motivation').value
                },
                responses: [],
                submittedAt: new Date().toISOString()
            };

            for(let i=1; i<=totalQuestions; i++) {
                const scoreEle = document.querySelector(`input[name="q${i}_score"]:checked`);
                const ansEle = document.querySelector(`textarea[name="q${i}_answer"]`);
                const caseEle = document.querySelector(`textarea[name="q${i}_case"]`);
                
                formData.responses.push({
                    questionId: i,
                    score: scoreEle ? parseInt(scoreEle.value) : null,
                    answer: ansEle ? ansEle.value : "",
                    caseStudy: caseEle ? caseEle.value : ""
                });
            }

            // 統一寫入 Public 路徑，方便後台無須複雜跨節點查詢即可調閱
            const colRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'assessments');
            await addDoc(colRef, formData);

            // Show Success Modal
            const modal = document.getElementById('successModal');
            modal.classList.add('show');
            
        } catch (error) {
            console.error("Error writing document: ", error);
            alert("儲存失敗，請稍後再試或檢查網路連線。");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '確認送出評估表';
        }
    });

    window.closeModal = function() {
        document.getElementById('successModal').classList.remove('show');
        // Optionally reset form after success: document.getElementById('assessmentForm').reset();
    };

    document.addEventListener('DOMContentLoaded', async () => {
        setTodayDate();
        renderQuestions();
        setupEventListeners();
        await initAuth();
    });

    // === 管理員後台邏輯 ===
    window.showAdminLogin = function() {
        document.getElementById('pwdErrorMsg').textContent = '';
        document.getElementById('adminPwd').value = '';
        document.getElementById('adminLoginModal').classList.add('show');
    };

    window.closeAdminModal = function() {
        document.getElementById('adminLoginModal').classList.remove('show');
    };

    window.verifyAdmin = function() {
        const pwd = document.getElementById('adminPwd').value;
        const errorMsg = document.getElementById('pwdErrorMsg');
        
        if(pwd === "7310168888") {
            closeAdminModal();
            document.getElementById('mainContainer').style.display = 'none';
            document.querySelector('.progress-tracker').style.display = 'none';
            document.getElementById('adminPanel').classList.add('active');
            loadAssessments();
        } else {
            errorMsg.textContent = '密碼錯誤，請重新輸入！';
        }
    };

    window.exitAdmin = function() {
        document.getElementById('adminPanel').classList.remove('active');
        document.getElementById('mainContainer').style.display = 'block';
        document.querySelector('.progress-tracker').style.display = 'flex';
    };

    async function loadAssessments() {
        if (!currentUser) return;
        const tbody = document.getElementById('assessmentList');
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">資料載入中...</td></tr>';
        
        try {
            const colRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'assessments');
            const snapshot = await getDocs(colRef);
            
            let dataList = [];
            snapshot.forEach(doc => {
                dataList.push({ id: doc.id, ...doc.data() });
            });
            
            // 在記憶體中進行降冪排序（最新提交在上）
            dataList.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));
            
            tbody.innerHTML = '';
            if(dataList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--text-gray);">尚無應徵者提交評估表</td></tr>';
                return;
            }

            dataList.forEach(item => {
                let totalScore = 0;
                let scoresHtml = '<div style="display:flex; gap:5px; flex-wrap:nowrap; overflow-x:auto; padding-bottom:5px;">';
                
                if(item.responses) {
                    item.responses.forEach(r => {
                        const s = r.score || 0;
                        totalScore += s;
                        scoresHtml += `<span style="background:#e8f0eb; padding:3px 8px; border-radius:4px; font-size:12px; white-space:nowrap; color:var(--primary); font-weight:bold;">Q${r.questionId}: ${s}</span>`;
                    });
                }
                scoresHtml += '</div>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.basicInfo?.date || '-'}</td>
                    <td>${item.basicInfo?.name || '-'}</td>
                    <td>${item.basicInfo?.experience || '-'}</td>
                    <td>${item.basicInfo?.scale || '-'}</td>
                    <td style="font-weight:bold; color:var(--primary);">${totalScore} / 95</td>
                    <td style="max-width:350px;">${scoresHtml}</td>
                    <td><button class="btn-view" onclick="viewDetails('${item.id}')">詳細 / 相片</button></td>
                `;
                // 將物件資料以 JSON 暫存於 DOM，以便開窗時讀取
                tr.dataset.fullData = JSON.stringify(item);
                tbody.appendChild(tr);
            });
        } catch(error) {
            console.error("讀取列表失敗:", error);
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">權限不足或載入失敗</td></tr>';
        }
    }

    window.viewDetails = function(id) {
        const rows = document.querySelectorAll('#assessmentList tr');
        let data = null;
        rows.forEach(row => {
            if(row.dataset.fullData) {
                const d = JSON.parse(row.dataset.fullData);
                if(d.id === id) data = d;
            }
        });
        
        if(!data) return;
        
        let detailHtml = `<h4 style="color:var(--primary); margin-bottom:10px;">👤 基本資料</h4>`;
        detailHtml += `<p><strong>姓名：</strong>${data.basicInfo.name}</p>`;
        detailHtml += `<p><strong>經驗：</strong>${data.basicInfo.experience}</p>`;
        detailHtml += `<p><strong>應徵動機：</strong><br>${data.basicInfo.motivation}</p>`;
        
        // 個人專屬相片管理區塊
        detailHtml += `<hr style="margin:20px 0; border:0; border-top:1px solid #eee;">`;
        detailHtml += `<h4 style="color:var(--primary); margin-bottom:15px;">📸 相關照片管理</h4>`;
        detailHtml += `
            <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
                <input type="file" id="photoInput_${id}" accept="image/*" style="border:1px solid #ccc; padding:8px; border-radius:4px; background:#fafafa; width:100%;">
                <button onclick="uploadApplicantPhoto('${id}')" style="padding:10px 15px;background:var(--accent);color:white;border:none;border-radius:4px;cursor:pointer; white-space:nowrap; font-weight:bold;">上傳</button>
            </div>
            <div id="uploadStatus_${id}" style="font-size:13px; margin-bottom:15px; height:18px;"></div>
            <div class="photo-gallery" id="photoGallery_${id}" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap:10px; margin-bottom:20px;">
                <span style="color:#666; font-size:13px;">照片載入中...</span>
            </div>
        `;

        detailHtml += `<hr style="margin:20px 0; border:0; border-top:1px solid #eee;">`;
        detailHtml += `<h4 style="color:var(--primary); margin-bottom:15px;">📋 答題紀錄</h4>`;
        
        if(data.responses) {
            data.responses.forEach(r => {
                detailHtml += `<div style="margin-bottom:15px; background:#f5f7f6; padding:15px; border-radius:6px; border-left:4px solid var(--accent);">
                    <div style="font-weight:bold; margin-bottom:8px; color:#111;">題號：${r.questionId} (自評：${r.score || '未評'})</div>
                    <div style="margin-bottom:5px;"><strong>【回答】</strong><br>${r.answer || '無'}</div>
                    <div style="color:var(--text-gray);"><strong>【案例】</strong><br>${r.caseStudy || '未填寫'}</div>
                </div>`;
            });
        }

        // 複用成功彈窗來顯示詳細資料，覆寫內容與最大寬度
        const modal = document.getElementById('successModal');
        modal.querySelector('.modal-content').innerHTML = `
            <div style="text-align:left; max-height:75vh; overflow-y:auto; padding-right:10px;">
                ${detailHtml}
            </div>
            <button onclick="closeModal()" style="margin-top:20px; width:100%; background:#666; padding:12px; font-weight:bold;">關閉視窗</button>
        `;
        modal.querySelector('.modal-content').style.maxWidth = '650px';
        modal.classList.add('show');

        // 載入該應徵者的專屬照片
        setTimeout(() => loadApplicantPhotos(id), 100);
    };

    // 彈窗關閉邏輯覆寫（避免被查看詳細畫面污染）
    window.closeModal = function() {
        const modal = document.getElementById('successModal');
        modal.classList.remove('show');
        // 等待淡出動畫結束後，恢復送出成功的預設版型
        setTimeout(() => {
            modal.querySelector('.modal-content').style.maxWidth = '400px';
            modal.querySelector('.modal-content').innerHTML = `
                <h3>✅ 提交成功</h3>
                <p>您的評估表已成功記錄至系統，感謝您的填寫。</p>
                <button onclick="closeModal()">關閉</button>
            `;
        }, 300);
    };

    window.uploadApplicantPhoto = async function(assessmentId) {
        if (!currentUser) return;
        const fileInput = document.getElementById(`photoInput_${assessmentId}`);
        const file = fileInput.files[0];
        const statusDiv = document.getElementById(`uploadStatus_${assessmentId}`);
        
        if(!file) { 
            statusDiv.textContent = "❌ 請先選擇照片檔案"; 
            statusDiv.style.color = "red";
            return; 
        }
        
        statusDiv.textContent = '⏳ 照片上傳中，請稍候...';
        statusDiv.style.color = 'var(--text-gray)';
        
        try {
            // 建立不重複檔名
            const fileName = `${Date.now()}_${file.name}`;
            const storageRef = ref(storage, `artifacts/${appIdStr}/photos/${assessmentId}/${fileName}`);
            const uploadTask = await uploadBytesResumable(storageRef, file);
            const downloadURL = await getDownloadURL(storageRef);
            
            // 將取得的圖檔網址與人員ID存進 Firestore
            const photoColRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'photos');
            await addDoc(photoColRef, { 
                assessmentId: assessmentId,
                url: downloadURL, 
                fileName: file.name,
                uploadedAt: new Date().toISOString() 
            });
            
            statusDiv.textContent = '✅ 上傳成功！';
            statusDiv.style.color = 'var(--success)';
            fileInput.value = '';
            loadApplicantPhotos(assessmentId); // 重新整理該人員的照片圖庫
        } catch(error) {
            console.error("上傳照片失敗:", error);
            statusDiv.textContent = '❌ 上傳失敗，請檢查網路連線。';
            statusDiv.style.color = 'red';
        }
    };

    window.loadApplicantPhotos = async function(assessmentId) {
        const gallery = document.getElementById(`photoGallery_${assessmentId}`);
        if (!gallery) return;
        
        try {
            const colRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'photos');
            const snapshot = await getDocs(colRef);
            
            let photos = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                if(data.assessmentId === assessmentId) {
                    photos.push(data);
                }
            });
            
            photos.sort((a,b) => new Date(b.uploadedAt) - new Date(a.uploadedAt));
            
            gallery.innerHTML = '';
            if(photos.length === 0) {
                gallery.innerHTML = '<span style="color:#999; font-size:13px;">該人員尚未上傳任何照片。</span>';
                return;
            }
            
            photos.forEach(p => {
                const img = document.createElement('img');
                img.src = p.url;
                img.alt = p.fileName || '照片';
                img.title = p.fileName || '照片';
                // 套用行內樣式確保網格顯示
                img.style.width = '100%';
                img.style.height = '120px';
                img.style.objectFit = 'cover';
                img.style.borderRadius = '6px';
                img.style.border = '1px solid #e0e0e0';
                gallery.appendChild(img);
            });
        } catch(error) {
            console.error("載入照片失敗:", error);
            gallery.innerHTML = '<span style="color:red; font-size:13px;">照片載入失敗</span>';
        }
    };

</script>
</body>
</html>
